services:
  app:
    container_name: nexum-api-prod
    build:
      context: .
      dockerfile: Dockerfile.prod
    ports:
      - '${PORT}:3000'
    env_file:
      - .env.prod
    depends_on:
      - db
    networks:
      - nexum-network-prod
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/healthcheck']
      interval: 30s
      timeout: 5s
      retries: 3

  db:
    image: postgres:15-alpine
    container_name: nexum-postgres-prod
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - pgdata-prod:/var/lib/postgresql/data
    networks:
      - nexum-network-prod
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER}']
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  nexum-network-prod:
    driver: bridge

volumes:
  pgdata-prod:
